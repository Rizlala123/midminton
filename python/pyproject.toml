[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "midminton-worker"
version = "0.1.0"
description = "Local, reviewable badminton video analysis worker"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
vision = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "onnxruntime>=1.20,<2"]
gpu = ["numpy>=1.26,<3", "opencv-python-headless>=4.10,<5", "onnxruntime-gpu>=1.20,<2"]
export = ["Pillow>=11,<13"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["midminton*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
